apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  labels:
    purpose: bootstrap
spec:
  project: default
  
  source:
    repoURL: https://github.com/Ice-Bear-Institute/terraform-golden-repo
    targetRevision: HEAD
    path: argocd/applications
    
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    
  revisionHistoryLimit: 3